<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKAIRA - Scale Up Bisnis Anda</title>
    
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-blue: #00a8ff;
            --nav-bg: rgba(0, 11, 24, 0.9);
            /* Warna Baru: Royal Blue Gradient */
            --menu-gradient: linear-gradient(135deg, #4834d4, #686de0);
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background-color: #000b18; 
            color: #ffffff; 
            line-height: 1.6; 
            overflow-x: hidden; 
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0; left: 0;
            z-index: 1;
            background-image: radial-gradient(circle at center, #001f3f 0%, #000b18 100%);
        }

        /* =========================================
            NAVIGASI ATAS (Brand & Menu Ikon)
           ========================================= */
        nav { 
            background: var(--nav-bg); 
            backdrop-filter: blur(10px);
            padding: 1rem 5%; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: fixed; top: 0; width: 100%; z-index: 1000; 
            border-bottom: 1px solid var(--border-glass);
        }

        .logo { 
            font-family: 'EB Garamond', serif;
            font-size: 2.2rem; 
            font-weight: 800; 
            color: #ffffff; 
            text-transform: uppercase;
        }

        /* MENU OVAL DENGAN IKON */
        .nav-oval-container {
            background: var(--menu-gradient); 
            padding: 8px 25px;
            border-radius: 60px; /* Oval sempurna */
            display: flex;
            gap: 15px;
            box-shadow: 0 10px 25px rgba(72, 52, 212, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item {
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 12px;
            border-radius: 12px;
            transition: 0.3s;
            min-width: 70px;
        }

        .nav-item i {
            font-size: 1.2rem;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .nav-item span {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        /* ACTIVE STATE (Contoh: Home sedang terpilih) */
        .nav-item.active {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* HERO SECTION */
        .hero { 
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 200px 5% 80px;
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h1 { 
            font-size: 3.8rem;
            font-weight: 800; 
            margin-bottom: 25px; 
            text-shadow: 0 5px 20px rgba(0,0,0,0.6);
            max-width: 900px;
        }

        .hero p { 
            max-width: 750px; 
            margin: 0 auto 50px; 
            font-size: 1.25rem; 
            color: rgba(255,255,255,0.9);
        }

        .btn-consult { 
            display: inline-block; 
            padding: 16px 45px; 
            background: var(--primary-blue);
            color: #ffffff; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: bold; 
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0, 168, 255, 0.4);
        }

        .btn-consult:hover { 
            background: #0086cc; 
            transform: translateY(-3px); 
        }

        @media (max-width: 992px) {
            nav { flex-direction: column; gap: 15px; padding: 1rem; }
            .nav-oval-container { gap: 5px; padding: 5px 15px; }
            .nav-item { min-width: 55px; padding: 5px; }
            .hero h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <nav>
        <div class="logo">MAKAIRA</div>

        <div class="nav-oval-container">
            <a href="#web" class="nav-item active">
                <i class="fas fa-desktop"></i>
                <span>Website</span>
            </a>
            <a href="#ads" class="nav-item">
                <i class="fas fa-bullhorn"></i>
                <span>Iklan</span>
            </a>
            <a href="#app" class="nav-item">
                <i class="fas fa-mobile-alt"></i>
                <span>Aplikasi</span>
            </a>
            <a href="#erp" class="nav-item">
                <i class="fas fa-layer-group"></i>
                <span>ERP</span>
            </a>
            <a href="#contact" class="nav-item">
                <i class="fas fa-address-book"></i>
                <span>Kontak</span>
            </a>
        </div>
    </nav>

    <section class="hero" id="home">
        <h1>Scale Up Bisnis Anda Bersama MAKAIRA</h1>
        <p>Solusi Digital Terintegrasi: Google Ads, Meta Ads, Pembuatan Website & Custom ERP untuk Pertumbuhan Bisnis yang Eksponensial.</p>
        <a href="https://wa.me/628123456789" class="btn-consult">Konsultasi Strategi Sekarang</a>
    </section>

    <a href="https://wa.me/628123456789" style="position: fixed; bottom: 30px; right: 30px; background: #25d366; color: white; padding: 15px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
        <i class="fab fa-whatsapp"></i> WhatsApp Admin
    </a>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 90, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#00a8ff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.6, "random": false },
                "size": { "value": 3.5, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#00a8ff", "opacity": 0.4, "width": 1.2 },
                "move": { "enable": true, "speed": 2.5, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "resize": true }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>

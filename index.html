<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAKAIRA - Scale Up Bisnis Anda</title>
    
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-blue: #00a8ff; /* Biru terang premium */
            --nav-bg: rgba(0, 11, 24, 0.9); /* Gelap untuk navigasi */
            --menu-oval-bg: #3bd1d3; /* Cyan terang untuk oval menu */
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { 
            background-color: #000b18; /* Biru gelap pekat */
            color: #ffffff; 
            line-height: 1.6; 
            overflow-x: hidden; 
        }

        /* 1. BACKGROUND ANIMASI TITIK & GARIS (Particles.js) */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1; /* Di belakang konten */
            background-image: radial-gradient(circle at center, #001f3f 0%, #000b18 100%);
        }

        /* =========================================
           2. NAVIGASI ATAS (Brand & Menu Oval)
           ========================================= */
        nav { 
            background: var(--nav-bg); 
            backdrop-filter: blur(10px);
            padding: 1rem 5%; 
            display: flex; 
            justify-content: space-between; /* Brand kiri, Menu kanan */
            align-items: center; 
            position: fixed; top: 0; width: 100%; z-index: 1000; 
            border-bottom: 1px solid var(--border-glass);
        }

        /* BRAND / LOGO OTENTIK (Sebelah Kiri) */
        .logo { 
            font-family: 'EB Garamond', serif; /* Font otentik, klasik, mudah dibaca */
            font-size: 2.2rem; 
            font-weight: 800; 
            color: #ffffff; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* MENU OVAL (Sebelah Kanan) */
        .nav-oval-container {
            background-color: var(--menu-oval-bg); /* Cyan terang sesuai gambar 1 */
            padding: 10px 30px;
            border-radius: 50px; /* Membuat bentuk kapsul oval */
            display: flex;
            gap: 20px; /* Jarak antar menu */
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .nav-oval-container a { 
            text-decoration: none; 
            color: #ffffff; /* Teks menu putih */
            font-weight: 600; 
            font-size: 0.9rem;
            transition: 0.3s; 
            text-transform: capitalize; /* Huruf besar di awal kata */
        }

        .nav-oval-container a:hover { 
            color: var(--nav-bg); /* Berubah gelap saat hover */
        }

        /* =========================================
           3. HERO SECTION (Teks Besar dari Gambar 2)
           ========================================= */
        .hero { 
            position: relative;
            z-index: 2; /* Di depan partikel */
            text-align: center;
            padding: 180px 5% 80px; /* Padding atas besar agar navigasi tidak menutupi */
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Judul Besar (Teks Gambar 2) */
        .hero h1 { 
            font-size: 3.8rem; /* Lebih besar & menonjol */
            font-weight: 800; 
            color: #ffffff; /* Putih bersih */
            margin-bottom: 25px; 
            text-shadow: 0 5px 20px rgba(0,0,0,0.6); /* Efek bayangan agar teks 'on' */
            max-width: 900px;
            line-height: 1.1;
        }

        /* Deskripsi (Teks Gambar 2) */
        .hero p { 
            max-width: 750px; 
            margin: 0 auto 50px; 
            font-size: 1.25rem; 
            color: rgba(255,255,255,0.9); /* Putih sedikit transparan */
            font-weight: 400;
        }

        /* TOMBOL KONSULTASI (Biru dari Gambar 2) */
        .btn-consult { 
            display: inline-block; 
            padding: 16px 45px; 
            background: var(--primary-blue); /* Biru terang dari Gambar 2 */
            color: #ffffff; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: bold; 
            font-size: 1.1rem;
            box-shadow: 0 8px 20px rgba(0, 168, 255, 0.4);
            transition: 0.3s;
        }

        .btn-consult:hover { 
            background: #0086cc; 
            transform: translateY(-3px) scale(1.03); 
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) { 
            .logo { font-size: 1.8rem; }
            .nav-oval-container { padding: 8px 15px; gap: 10px; flex-wrap: wrap; justify-content: center; }
            .nav-oval-container a { font-size: 0.8rem; }
            .hero h1 { font-size: 2.2rem; } 
            .hero p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <nav>
        <div class="logo">MAKAIRA</div>

        <div class="nav-oval-container">
            <a href="#home">Home</a>
            <a href="#about">About Us</a>
            <a href="#ads">Ads Service</a>
            <a href="#web">Web Develop</a>
            <a href="#app">App Develop</a>
            <a href="#erp">Enterprise Solution</a>
        </div>
    </nav>

    <section class="hero" id="home">
        <h1>Scale Up Bisnis Anda Bersama MAKAIRA</h1>
        <p>Solusi Digital Terintegrasi: Google Ads, Meta Ads, Pembuatan Website & Custom ERP untuk Pertumbuhan Bisnis yang Eksponensial.</p>
        
        <a href="https://wa.me/628123456789" class="btn-consult">Konsultasi Strategi Sekarang</a>
    </section>

    <a href="https://wa.me/628123456789" style="position: fixed; bottom: 30px; right: 30px; background: #25d366; color: white; padding: 15px 25px; border-radius: 50px; text-decoration: none; font-weight: bold; z-index: 1000; box-shadow: 0 10px 20px rgba(0,0,0,0.3);">
        WhatsApp Admin
    </a>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 90, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#00a8ff" }, /* Warna titik biru premium */
                "shape": { "type": "circle" },
                "opacity": { "value": 0.6, "random": false },
                "size": { "value": 3.5, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#00a8ff", "opacity": 0.4, "width": 1.2 },
                "move": { "enable": true, "speed": 2.5, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
                "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 1 } } }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
